<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#151412">
  <title>TONIC — 譜読みトレーニング</title>
  <link rel="stylesheet" href="styles.css?v=20261029-2">
</head>
<body>
  <div class="shell">
    <header class="site-header">
      <a class="brand" href="../" aria-label="相対音感トレーニングへ戻る">
        <span class="brand-mark" aria-hidden="true"></span>
        <span><strong>TONIC</strong><small>SCORE READ</small></span>
      </a>
      <a class="back-link" href="../">← 音感ゲーム</a>
    </header>

    <main>
      <section class="setup-panel" id="setupPanel">
        <div class="setup-copy">
          <p class="eyebrow">SIGHT-READING / 01</p>
          <h1>流れる音符を<br>読み取る。</h1>
          <p>右から左へ流れる音符を、ドレミで答えます。</p>
        </div>
        <form class="setup-form" id="setupForm">
          <fieldset>
            <legend><span>01</span>音部記号</legend>
            <div class="choice-grid clef-choices">
              <label><input type="radio" name="clefMode" value="treble" checked><span><b>𝄞</b>ト音記号</span></label>
              <label><input type="radio" name="clefMode" value="bass"><span><b>𝄢</b>ヘ音記号</span></label>
              <label><input type="radio" name="clefMode" value="alternate"><span><b>𝄞𝄢</b>交互</span></label>
            </div>
          </fieldset>

          <fieldset>
            <legend><span>02</span>問題数</legend>
            <div class="choice-grid count-choices">
              <label><input type="radio" name="questionCount" value="10"><span>10</span></label>
              <label><input type="radio" name="questionCount" value="20" checked><span>20</span></label>
              <label><input type="radio" name="questionCount" value="30"><span>30</span></label>
            </div>
          </fieldset>

          <fieldset>
            <legend><span>03</span>流れる速さ</legend>
            <label class="speed-control" for="flowSeconds">
              <span>速い</span>
              <input id="flowSeconds" name="flowSeconds" type="range" min="2" max="8" step="0.5" value="4">
              <span>遅い</span>
              <output id="flowSecondsValue" for="flowSeconds">4.0秒</output>
            </label>
          </fieldset>

          <button class="primary-button" type="submit">始める →</button>
        </form>
      </section>

      <section class="game-panel" id="gamePanel" hidden>
        <div class="game-topbar">
          <button class="home-button" id="homeButton" type="button">← ホーム</button>
          <div><span>QUESTION</span><strong><i id="roundValue">1</i>/<i id="totalValue">20</i></strong></div>
          <div><span>SCORE</span><strong id="scoreValue">0</strong></div>
          <div><span>ACCURACY</span><strong id="accuracyValue">—</strong></div>
        </div>

        <div class="staff-wrap" id="staffWrap">
          <svg class="staff" id="staff" viewBox="0 0 1000 440" role="img" aria-labelledby="staffTitle staffDescription">
            <title id="staffTitle">譜読み問題</title>
            <desc id="staffDescription">右から左へ音符が流れます</desc>
            <rect class="staff-paper" width="1000" height="440" rx="20"></rect>
            <g class="staff-lines" aria-hidden="true">
              <line x1="35" y1="160" x2="970" y2="160"></line>
              <line x1="35" y1="190" x2="970" y2="190"></line>
              <line x1="35" y1="220" x2="970" y2="220"></line>
              <line x1="35" y1="250" x2="970" y2="250"></line>
              <line x1="35" y1="280" x2="970" y2="280"></line>
            </g>
            <line class="answer-line" x1="205" y1="25" x2="205" y2="415" aria-hidden="true"></line>
            <text class="clef-symbol" id="clefSymbol" x="62" y="272" aria-hidden="true">𝄞</text>
            <g id="ledgerLines" aria-hidden="true"></g>
            <g class="note" id="noteGroup" aria-hidden="true">
              <ellipse id="noteHead" cx="0" cy="160" rx="16" ry="12" transform="rotate(-18 0 160)"></ellipse>
              <line id="noteStem" x1="14" y1="158" x2="14" y2="92"></line>
            </g>
          </svg>
          <div class="flow-progress" aria-hidden="true"><i id="flowProgress"></i></div>
          <p class="feedback" id="feedback" aria-live="assertive"></p>
        </div>

        <div class="answer-area">
          <p>音名を選ぶ</p>
          <div class="answer-buttons" id="answerButtons" role="group" aria-label="音名を選ぶ">
            <button type="button" data-degree="0"><kbd>Z</kbd><span>ド</span></button>
            <button type="button" data-degree="1"><kbd>X</kbd><span>レ</span></button>
            <button type="button" data-degree="2"><kbd>C</kbd><span>ミ</span></button>
            <button type="button" data-degree="3"><kbd>V</kbd><span>ファ</span></button>
            <button type="button" data-degree="4"><kbd>B</kbd><span>ソ</span></button>
            <button type="button" data-degree="5"><kbd>N</kbd><span>ラ</span></button>
            <button type="button" data-degree="6"><kbd>M</kbd><span>シ</span></button>
          </div>
        </div>
      </section>

      <section class="result-panel" id="resultPanel" hidden>
        <p class="eyebrow">RESULT</p>
        <p class="result-score"><strong id="resultPercent">0</strong><span>%</span></p>
        <h1 id="resultTitle">終了</h1>
        <p id="resultDetail"></p>
        <div class="result-actions">
          <button class="primary-button" id="retryButton" type="button">同じ設定でもう一度</button>
          <button class="secondary-button" id="settingsButton" type="button">設定を変える</button>
        </div>
      </section>
    </main>

    <footer>Version 1.1</footer>
  </div>
  <script src="app.js?v=20261029-2"></script>
</body>
</html>
